[package]
name = "purrgress"
version = "1.0.0"
edition = "2024"

documentation = "https://docs.rs"

description = "An ultra-fast, ergonomic DOD stage manager and async sequencer combining zero-cost performance with total runtime dynamism."

license = "MIT"

repository = "https://github.com/Honami333/purrgress"

keywords = ["state-machine", "async", "zero-cost", "sequencer", "lock-free"]

categories = ["asynchronous", "concurrency", "data-structures", "rust-patterns"]

exclude = [
    ".github/*",
    "target/*",
]

[dependencies]
bevy_ecs  = { version = "0.18", optional = true, default-features = false }
purrgress-macros = { version = "1.0.0", path = "./purrgress-macros", optional = true  }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }
rkyv = { version = "0.8.18", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
wibr = { version = "0.2.16", features = ["make_full"] }

[features]
default = ["train"]

train = ["macros", "purrgress-macros/train"]
dispatcher = ["train", "macros", "purrgress-macros/dispatcher", "dep:tokio"]

bevy_ecs = ["dep:bevy_ecs"]
rkyv = ["dep:rkyv"]
serde = ["dep:serde"]

macros = ["dep:purrgress-macros"]

single = []
spatial = []
cursor = []

core = []
alloc = ["core"]
std = ['alloc']



[[example]]
name = "purr_train"
path = "examples/purr_train.rs"
required-features = ["train"]

[[example]]
name = "purr_dispatcher"
path = "examples/purr_dispatcher.rs"
required-features = ["dispatcher"]

[package.metadata.docs.rs]
all-features = true